<!doctype html>
<html>
  <head>
    <title>IRIS Login</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="login-section">
      <div class="login-card">
        <span class="section-label">Welcome back</span>
        <h1>Sign in to IRIS</h1>
        <p>
          Log in to continue exploring accessibility features and personalize
          your experience.
        </p>
        <form class="login-form">
          <label>
            Email
            <input type="email" placeholder="you@example.com" />
          </label>
          <label>
            Password
            <input type="password" placeholder="Enter your password" />
          </label>
          <button type="button" class="btn">Login</button>
        </form>
        <p class="login-footer">
          New to IRIS? <a href="index.html">Go back home</a>
        </p>
      </div>
    </section>
  </body>
</html>
