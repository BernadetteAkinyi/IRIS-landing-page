<!doctype html>
<html>
  <head>
    <title>Features</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="features">
      <span class="feat-label">Features</span>
      <h1>Experience Iris, your way</h1>
      <p>
        Try the accessibility features below and see how Iris adapts to your
        needs in real time.
      </p>
      <div class="feature-container">
        <div class="feature-list">
          <button class="feature-btn">High Contrast</button>
          <button class="feature-btn">Reading Mode</button>
          <button class="feature-btn">Text-to-Speech</button>
          <button class="feature-btn">Reduce Motion</button>
        </div>
        <div class="feature-preview">
          <h2>Welcome to IRIS</h2>
          <p>
            IRIS personalizes your experience by adapting content, appearance,
            and accessibility settings to match your needs.
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
